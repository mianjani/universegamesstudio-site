<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universe Games Studio (UGS) (SMC-Private) Limited | Mobile Game Developer & Publisher</title>
<meta name="description" content="Universe Games Studio (UGS) is a SECP-registered mobile game developer and publisher based in Lahore, Pakistan. Creators of Arrow Out and Animal Kingdom.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e17; --card:#121927; --surface:#182235; --line:#25324a;
  --blue:#3b82f6; --blue-d:#2563eb; --text:#f1f5f9; --muted:#9aa8bf; --green:#34d399;
  --head:'Sora','Segoe UI',system-ui,sans-serif; --body:'Inter','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f4f7fc; --card:#ffffff; --surface:#eaf0fa; --line:#d5dfef; --text:#0f1b2e; --muted:#51617c; --blue:#2563eb; --blue-d:#1d4ed8; --green:#047857;}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}

/* top bar */
.bar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-family:var(--head);font-weight:800;font-size:1.15rem;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:10px;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#93c5fd,var(--blue) 45%,#1e3a8a);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;left:-5px;top:13px;width:40px;height:4px;border-radius:4px;background:var(--text);opacity:.85;transform:rotate(-22deg)}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:.9rem;padding:8px 13px;border-radius:8px;transition:all 0.2s ease}
nav a:hover{color:var(--text);background:var(--surface)}
nav a.on{background:var(--blue);color:#fff}

main{max-width:1080px;margin:0 auto;padding:0 20px 80px}
.page{display:none}
.page.on{display:block}

/* hero */
.hero{padding:70px 0 50px;display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center}
.reg{display:inline-block;font-size:.82rem;font-weight:600;color:var(--green);border:1px solid color-mix(in srgb,var(--green) 40%,transparent);padding:5px 14px;border-radius:99px;margin-bottom:20px}
h1{font-family:var(--head);font-size:clamp(1.9rem,4.5vw,3rem);line-height:1.15;letter-spacing:-.03em;font-weight:800}
.lead{color:var(--muted);font-size:1.05rem;margin:18px 0 26px;max-width:56ch}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 22px;border-radius:10px;font-weight:600;font-size:.92rem;text-decoration:none;border:1px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--blue-d);text-decoration:none}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface)}

/* orbit animation */
.orbit{aspect-ratio:1;width:100%;max-width:360px;margin:0 auto;position:relative}
.orbit svg{width:100%;height:100%;overflow:visible}
.spin{transform-origin:200px 200px;animation:spin 40s linear infinite}
.spin.rev{animation-duration:62s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* games */
.sec{padding:40px 0 0}
h2{font-family:var(--head);font-size:1.55rem;letter-spacing:-.02em;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:24px;max-width:62ch}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px}
.game{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.game .tag{font-size:.8rem;color:var(--blue);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.game h3{font-family:var(--head);font-size:1.3rem;margin-bottom:6px}
.game .pkg{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;color:var(--muted);background:var(--surface);padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:12px;word-break:break-all}
.game p{color:var(--muted);font-size:.92rem;margin-bottom:14px}
.chips{display:flex;flex
