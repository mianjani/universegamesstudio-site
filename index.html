  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --card-inner: #1a243a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    header {
      padding: 60px 20px 40px;
      text-align: center;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 75%);
      border-bottom: 1px solid var(--border);
    }
    .badge {
      display: inline-block;
      padding: 5px 14px;
      background: rgba(37, 99, 235, 0.15);
      color: #60a5fa;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
      border: 1px solid rgba(37, 99, 235, 0.3);
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 700px;
      margin: 0 auto;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px 20px;
      background: rgba(19, 27, 46, 0.8);
      position: sticky;
      top: 0;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      flex-wrap: wrap;
    }
    nav button {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    nav button:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }
    nav button.active {
      background: var(--accent);
      color: #fff;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .tab-content.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 30px;
      margin-bottom: 25px;
    }
    h2 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      color: #fff;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    h3 {
      font-size: 1.15rem;
      margin: 20px 0 10px;
      color: #e2e8f0;
    }
    p { margin-bottom: 14px; color: #cbd5e1; font-size: 0.98rem; }
    ul { margin: 10px 0 18px 25px; color: #cbd5e1; }
    li { margin-bottom: 6px; }
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .feature-item {
      background: var(--card-inner);
      padding: 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .feature-item h4 {
      font-size: 1.05rem;
      color: #60a5fa;
      margin-bottom: 6px;
    }

      list-style: none;
      margin: 15px 0 0;
      padding: 0;
    }
