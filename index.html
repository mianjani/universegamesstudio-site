<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNIVERSE GAMES STUDIO (UGS) (SMC-PRIVATE) LIMITED | Official Developer Portal</title>
  <meta name="description" content="Official corporate developer portal of UNIVERSE GAMES STUDIO (UGS) (SMC-PRIVATE) LIMITED. SECP registered mobile game publisher, developers of Arrow Out and Animal Kingdom.">
  <style>
    :root {
      --bg-dark: #0a0e17;
      --bg-card: #121927;
      --bg-surface: #182235;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --border-light: #334155;
      --accent-green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.65;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    
    /* HEADER & BRANDING */
    header {
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg-dark) 80%);
      padding: 60px 20px 45px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .badge-secp {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      color: #ffffff;
    }
    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 780px;
      margin: 0 auto;
    }

    /* NAVIGATION */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(18, 25, 39, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    nav button {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    nav button:hover {
      background: var(--bg-surface);
      color: #ffffff;
    }
    nav button.active {
      background: var(--primary);
      color: #ffffff;
    }

    /* MAIN CONTENT WRAPPER */
    .container {
      max-width: 1060px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.25s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* CARDS & GRIDS */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 24px;
    }
    h2.card-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    h3 {
      font-size: 1.1rem;
      color: #93c5fd;
      margin: 20px 0 10px;
    }
    p { margin-bottom: 14px; color: #cbd5e1; font-size: 0.96rem; }
    ul { margin: 8px 0 16px 24px; color: #cbd5e1; }
    li { margin-bottom: 6px; font-size: 0.95rem; }

    /* FEATURED GAMES GRID */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 15px;
    }
    .game-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .game-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .package-tag {
      font-family: monospace;
      font-size: 0.8rem;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 12px;
      word-break: break-all;
    }

      display: flex
